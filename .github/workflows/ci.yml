name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint + typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # Génère les types de routes Next.js (PageProps, LayoutProps) sans build
      # complet : sans ce step, tsc --noEmit échoue à chaque run sur un
      # checkout vierge (dossier .next absent du dépôt).
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test